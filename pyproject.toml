[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-research"
version = "0.1.0"
description = "Multi-agent US stock research system with RAG over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "yfinance>=0.2.40",
    "tavily-python>=0.5.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
download-filings = "stock_research.scripts.download_filings:main"
chunk-filings = "stock_research.scripts.chunk_filings:main"
embed-filings = "stock_research.scripts.embed_filings:main"
ask-filings = "stock_research.scripts.ask_filings:main"
market-quote = "stock_research.scripts.market_quote:main"
web-search = "stock_research.scripts.web_search:main"
ask-agent = "stock_research.scripts.ask_agent:main"
research = "stock_research.scripts.research:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
